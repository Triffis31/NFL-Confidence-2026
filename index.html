<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFL Confidence League</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* iOS Safe Area Padding for modern iPhones */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    }
    
    /* Prevent pull-to-refresh background bleeding and tap highlights */
    body { 
      -webkit-tap-highlight-color: transparent; 
      overscroll-behavior-y: contain; 
      background-color: #f8fafc; /* Tailwind slate-50 */
    }
    
    /* Global utility for hiding SPA views */
    .hidden { display: none !important; }
  </style>

  <script>
    // Make sure to paste your published Apps Script Web App URL here
    const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; 
    
    // Global State Management
    let state = { email: '', role: 'Member', data: null };

    // Native Back Button Support (History API)
    window.onpopstate = function(event) {
      if (event.state && event.state.view) {
        navigate(event.state.view, false);
      } else {
        navigate('home-view', false);
      }
    };

    // App Initialization & Local Storage Check
    async function initApp() {
      const savedEmail = localStorage.getItem('nfl_email');
      const savedCode = localStorage.getItem('nfl_code');

      if (savedEmail && savedCode) {
        // Attempt silent login
        const res = await apiCall({ action: 'login', email: savedEmail, code: savedCode });
        
        if (res && res.success) {
          state.email = savedEmail;
          state.role = res.role;
          
          document.getElementById('loading-view').classList.add('hidden');
          document.getElementById('bottom-nav').classList.remove('hidden');
          navigate('home-view', true);
          return;
        }
      }
      
      // If no credentials or login failed, show the login screen
      document.getElementById('loading-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    // Standard API Fetch Wrapper
    async function apiCall(payload) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (e) {
        console.error("API Error:", e);
        return { success: false, message: 'Connection error. Check your Apps Script deployment URL.' };
      }
    }

    // View Routing Logic
    function navigate(viewId, pushHistory = true) {
      // Hide all main containers
      document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
      // Show targeted view
      document.getElementById(viewId).classList.remove('hidden');
      
      // Update history state
      if (pushHistory) {
        history.pushState({view: viewId}, "", "#" + viewId);
      }
    }

    // Login Form Handler
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const code = document.getElementById('code').value;
      const btn = document.getElementById('login-btn');
      const errorText = document.getElementById('login-error');
      
      // Loading State
      btn.innerText = 'Logging in...';
      btn.disabled = true;
      btn.classList.add('opacity-50');
      errorText.classList.add('hidden');

      const res = await apiCall({ action: 'login', email, code });
      
      if (res.success) {
        // Persist to local storage
        localStorage.setItem('nfl_email', email);
        localStorage.setItem('nfl_code', code);
        
        state.email = email;
        state.role = res.role;

        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('bottom-nav').classList.remove('hidden');
        navigate('home-view', true);
      } else {
        errorText.innerText = res.message;
        errorText.classList.remove('hidden');
      }
      
      // Reset Button
      btn.innerText = 'Log In';
      btn.disabled = false;
      btn.classList.remove('opacity-50');
    }

    // Run initApp when the DOM is fully loaded
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</head>
<body class="text-slate-900 pb-safe">
  
  <main class="max-w-md mx-auto p-4 min-h-screen relative pb-20">
    
    <!-- Loading View -->
    <div id="loading-view" class="flex flex-col items-center justify-center h-64 mt-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-slate-900 mb-4"></div>
      <p class="text-slate-500 font-medium text-sm">Loading Application...</p>
    </div>

    <!-- Login View -->
    <div id="login-view" class="hidden mt-20">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800">NFL Pool</h1>
      </div>
      <form onsubmit="handleLogin(event)" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
        <p id="login-error" class="hidden text-red-500 text-sm text-center bg-red-50 p-2 rounded border border-red-100"></p>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="email" class="w-full border-slate-300 rounded-lg p-3 border focus:ring-slate-900 outline-none transition" required>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Invite Code</label>
          <input type="text" id="code" class="w-full border-slate-300 rounded-lg p-3 border focus:ring-slate-900 outline-none uppercase transition" required>
        </div>
        <button type="submit" id="login-btn" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl mt-4 hover:bg-slate-800 transition">Log In</button>
      </form>
    </div>

    <!-- Dashboard / Home View -->
    <div id="home-view" class="hidden space-y-4 mt-6">
      <h2 class="text-2xl font-bold px-1 text-slate-800">Dashboard</h2>
      
      <button onclick="navigate('picks-view')" class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between active:scale-95 transition-transform">
        <div class="flex items-center">
          <span class="text-2xl mr-3">🏈</span>
          <span class="font-semibold text-lg text-slate-700">Submit Confidence Picks</span>
        </div>
        <span class="text-slate-400">→</span>
      </button>

      <button onclick="navigate('props-view')" class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between active:scale-95 transition-transform">
        <div class="flex items-center">
          <span class="text-2xl mr-3">🎯</span>
          <span class="font-semibold text-lg text-slate-700">Weekly Prop Plays</span>
        </div>
        <span class="text-slate-400">→</span>
      </button>

      <button onclick="navigate('leaderboard-view')" class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between active:scale-95 transition-transform">
        <div class="flex items-center">
          <span class="text-2xl mr-3">🏆</span>
          <span class="font-semibold text-lg text-slate-700">Leaderboard</span>
        </div>
        <span class="text-slate-400">→</span>
      </button>
    </div>

    <!-- Confidence Picks View Placeholder -->
    <div id="picks-view" class="hidden mt-6">
      <h2 class="text-2xl font-bold px-1 mb-4 text-slate-800">Weekly Picks</h2>
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-500">
        <!-- Future logic for 1-16 confidence selections goes here -->
        Picks interface construction pending.
      </div>
    </div>

    <!-- Prop Plays View Placeholder -->
    <div id="props-view" class="hidden mt-6">
      <h2 class="text-2xl font-bold px-1 mb-4 text-slate-800">Prop Plays</h2>
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-500">
        <!-- Future logic for weekly prop modifiers goes here -->
        Prop plays interface construction pending.
      </div>
    </div>

    <!-- Leaderboard View Placeholder -->
    <div id="leaderboard-view" class="hidden mt-6">
      <h2 class="text-2xl font-bold px-1 mb-4 text-slate-800">Leaderboard</h2>
      <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-500">
        <!-- Future logic for leaderboard tables goes here -->
        Leaderboard construction pending.
      </div>
    </div>

  </main>

  <!-- Bottom App Navigation -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 w-full bg-white border-t border-slate-200 px-6 py-3 flex justify-around text-xs font-semibold text-slate-400 z-40 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
    <button onclick="navigate('home-view')" class="flex flex-col items-center hover:text-slate-900 transition">
      <span class="text-xl mb-1">🏠</span>Home
    </button>
    <button onclick="navigate('picks-view')" class="flex flex-col items-center hover:text-slate-900 transition">
      <span class="text-xl mb-1">🏈</span>Picks
    </button>
    <button onclick="navigate('props-view')" class="flex flex-col items-center hover:text-slate-900 transition">
      <span class="text-xl mb-1">🎯</span>Props
    </button>
    <button onclick="navigate('leaderboard-view')" class="flex flex-col items-center hover:text-slate-900 transition">
      <span class="text-xl mb-1">🏆</span>Board
    </button>
  </nav>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
